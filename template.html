<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0E11">
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://7sh7.github.io/">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://7sh7.github.io/">
  <title>{{PAGE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@600;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0A0E11;
      --panel: #111920;
      --panel-raised: #162129;
      --border: #22313C;
      --text: #E3EBF1;
      --muted: #95A6B3;
      --signal: #4FD1C5;
      --accent: #E0A458;
      --danger: #FF8A80;
      --header-height: 4rem;
      --radius: 4px;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
      --sans: "IBM Plex Sans KR", "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --condensed: "IBM Plex Sans Condensed", "IBM Plex Sans KR", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-height) + 1.25rem);
      background: var(--bg);
    }

    body {
      min-width: 0;
      margin: 0;
      overflow-x: clip;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(79, 209, 197, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 209, 197, 0.028) 1px, transparent 1px);
      background-size: 44px 44px;
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.7;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      color: var(--bg);
      background: var(--signal);
    }

    :focus-visible {
      outline: 3px solid var(--signal);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    img,
    picture,
    video,
    svg {
      display: block;
      max-width: 100%;
    }

    svg {
      overflow: visible;
    }

    button,
    input,
    select,
    textarea {
      color: inherit;
      font: inherit;
    }

    button,
    summary {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: var(--signal);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
    }

    a:hover {
      color: var(--text);
    }

    p,
    ul,
    ol,
    dl {
      margin-block: 0 1rem;
    }

    h1,
    h2,
    h3,
    h4 {
      max-width: 100%;
      margin-block: 0 0.7em;
      color: var(--text);
      font-family: var(--condensed);
      line-height: 1.12;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    html:lang(ko) h1,
    html:lang(ko) h2,
    html:lang(ko) h3,
    html:lang(ko) h4 {
      word-break: keep-all;
    }

    h1 {
      max-width: 16ch;
      font-size: clamp(2.7rem, 7vw, 5.75rem);
      letter-spacing: -0.045em;
    }

    h2 {
      font-size: clamp(2rem, 4vw, 3.35rem);
      letter-spacing: -0.025em;
    }

    h3 {
      font-size: clamp(1.3rem, 2vw, 1.75rem);
    }

    code,
    pre,
    kbd,
    samp {
      font-family: var(--mono);
    }

    code {
      overflow-wrap: anywhere;
      color: var(--accent);
    }

    pre {
      max-width: 100%;
      overflow-x: auto;
      padding: 1rem;
      border: 1px solid var(--border);
      background: var(--panel);
    }

    hr {
      margin-block: 2rem;
      border: 0;
      border-top: 1px solid var(--border);
    }

    .container {
      width: min(calc(100% - 2rem), 1080px);
      margin-inline: auto;
    }

    .section,
    main > section,
    [id] {
      scroll-margin-top: calc(var(--header-height) + 1.25rem);
    }

    .section,
    main > section {
      padding-block: clamp(4rem, 8vw, 7rem);
    }

    .section + .section,
    main > section + section {
      border-top: 1px solid var(--border);
    }

    .section-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(15rem, 0.55fr);
      gap: 2rem;
      align-items: end;
      margin-bottom: clamp(2rem, 5vw, 3.5rem);
    }

    .section-heading > * {
      min-width: 0;
      margin-bottom: 0;
    }

    .eyebrow,
    .section-label,
    .meta,
    .tag,
    .badge,
    .build-date {
      font-family: var(--mono);
    }

    .eyebrow,
    .section-label {
      margin-bottom: 0.8rem;
      color: var(--signal);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .muted,
    .section-intro,
    .meta {
      color: var(--muted);
    }

    .skip-link {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 1000;
      padding: 0.7rem 1rem;
      border: 2px solid var(--signal);
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-weight: 600;
      transform: translateY(-160%);
      transition: transform 140ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      min-width: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 14, 17, 0.94);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      min-height: var(--header-height);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: clamp(1rem, 3vw, 2.5rem);
      align-items: center;
    }

    .brand {
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-decoration: none;
      white-space: nowrap;
    }

    .primary-nav {
      min-width: 0;
    }

    .primary-nav ul {
      display: flex;
      justify-content: center;
      gap: clamp(0.7rem, 2vw, 1.5rem);
      min-width: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .primary-nav a {
      display: block;
      padding-block: 0.55rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }

    .primary-nav a:hover,
    .primary-nav a:focus-visible {
      color: var(--signal);
    }

    .language-switcher,
    .project-filters,
    .actions,
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }

    [data-lang-button],
    [data-filter],
    .button {
      min-height: 2.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 140ms ease, color 140ms ease, background-color 140ms ease;
    }

    [data-lang-button],
    [data-filter] {
      padding: 0.65rem 0.8rem;
    }

    [data-lang-button]:hover,
    [data-filter]:hover,
    [data-lang-button][aria-pressed="true"],
    [data-filter][aria-pressed="true"] {
      border-color: var(--signal);
      background: rgba(79, 209, 197, 0.09);
      color: var(--signal);
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 0.85rem 1.05rem;
    }

    .button--primary {
      border-color: var(--signal);
      background: var(--signal);
      color: var(--bg);
    }

    .button--primary:hover {
      background: var(--text);
      color: var(--bg);
    }

    .hero {
      min-height: min(760px, calc(100svh - var(--header-height)));
      display: grid;
      align-items: center;
      padding-block: clamp(4.5rem, 10vw, 8rem);
    }

    .hero-stack {
      max-width: 60rem;
    }

    .hero-stack > *,
    .live-card > *,
    .project-card > *,
    .timeline-item > * {
      min-width: 0;
    }

    .hero-lede {
      max-width: 62ch;
      margin-bottom: 1.75rem;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.28rem);
    }

    .live-card,
    .panel,
    .card,
    .project-card,
    .stat,
    .timeline-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .live-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(15rem, 0.6fr);
      gap: clamp(1.5rem, 5vw, 4rem);
      padding: clamp(1.5rem, 4vw, 2.75rem);
      border-top: 3px solid var(--signal);
    }

    .live-card::before {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 0 0.28rem rgba(79, 209, 197, 0.12);
      content: "";
    }

    .live-card .actions {
      margin-top: 1.5rem;
    }

    .architecture-disclosure,
    .more-disclosure {
      margin-top: 1rem;
      overflow: hidden;
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .architecture-disclosure > summary,
    .more-disclosure > summary {
      padding: 1rem 1.25rem;
    }

    .architecture-figure {
      margin: 0;
      padding: 1rem;
      border-top: 1px solid var(--border);
    }

    .architecture-figure a {
      display: block;
      overflow: hidden;
      border-radius: calc(var(--radius) / 2);
      background: #fff;
    }

    .architecture-figure img {
      width: 100%;
      height: auto;
    }

    .architecture-figure figcaption {
      margin-top: 0.8rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .evidence-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .evidence-list li {
      padding-block: 0.7rem;
      border-bottom: 1px solid var(--border);
    }

    .evidence-list li:last-child {
      border-bottom: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .stat {
      min-width: 0;
      padding: clamp(1.15rem, 3vw, 1.7rem);
      box-shadow: none;
    }

    .stat-value {
      display: block;
      color: var(--signal);
      font-family: var(--mono);
      font-size: clamp(1.7rem, 4vw, 2.45rem);
      font-weight: 600;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .stat-label {
      display: block;
      margin-top: 0.65rem;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 1rem;
    }

    .timeline::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 11.45rem;
      width: 1px;
      background: var(--border);
      content: "";
    }

    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 10rem minmax(0, 1fr);
      gap: 2.5rem;
      padding: clamp(1.25rem, 3vw, 2rem);
      box-shadow: none;
    }

    .timeline-item::before {
      position: absolute;
      top: 2rem;
      left: calc(11.45rem - 0.33rem);
      width: 0.66rem;
      height: 0.66rem;
      border: 2px solid var(--bg);
      border-radius: 50%;
      background: var(--signal);
      content: "";
    }

    .timeline-date {
      color: var(--signal);
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .step-trace {
      width: 100%;
      height: 2.5rem;
      margin-bottom: 1.25rem;
      color: var(--signal);
    }

    .step-trace path,
    .step-trace polyline {
      fill: none;
      stroke: currentColor;
      stroke-linecap: square;
      stroke-linejoin: miter;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .project-filters {
      margin-bottom: 1.5rem;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .project-card {
      display: block;
      min-width: 0;
      margin-top: 0;
      padding: 0;
      overflow: hidden;
      border-top: 3px solid var(--border);
      box-shadow: none;
    }

    .project-overview {
      position: relative;
      display: grid;
      gap: 0.75rem;
      padding: clamp(1.25rem, 3vw, 2rem);
      padding-right: clamp(3.25rem, 6vw, 4.5rem);
      list-style: none;
    }

    .project-overview::-webkit-details-marker {
      display: none;
    }

    .project-overview::after {
      position: absolute;
      top: clamp(1.25rem, 3vw, 2rem);
      right: clamp(1.25rem, 3vw, 2rem);
      color: var(--signal);
      content: "+";
      font-family: var(--mono);
      font-size: 1.4rem;
      line-height: 1;
    }

    .project-card[open] .project-overview {
      border-bottom: 1px solid var(--border);
    }

    .project-card[open] .project-overview::after {
      content: "−";
    }

    .project-title {
      display: block;
      color: var(--text);
      font-family: var(--condensed);
      font-size: clamp(1.3rem, 2vw, 1.75rem);
      font-weight: 700;
      line-height: 1.12;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    html:lang(ko) .project-title,
    html:lang(ko) .project-outcome {
      word-break: keep-all;
    }

    .project-outcome {
      color: var(--muted);
      line-height: 1.65;
    }

    .project-more {
      color: var(--signal);
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .project-detail {
      padding: clamp(1.25rem, 3vw, 2rem);
    }

    .project-detail > .tag-list:first-child {
      margin-top: 0;
    }

    .project-card .actions {
      margin-top: 0;
      padding-top: 1.25rem;
    }

    .tag-list {
      margin: 1rem 0;
      padding: 0;
      list-style: none;
    }

    .tag,
    .badge {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      min-height: 1.9rem;
      padding: 0.25rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel-raised);
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.2;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .badge--live,
    .badge--signal {
      border-color: var(--signal);
      color: var(--signal);
    }

    .badge--accent {
      border-color: var(--accent);
      color: var(--accent);
    }

    .panel,
    .card {
      padding: clamp(1.25rem, 3vw, 2rem);
      box-shadow: none;
    }

    .compact-grid,
    .split-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    details {
      margin-top: 1rem;
      border-top: 1px solid var(--border);
    }

    summary {
      padding-block: 0.9rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    summary::marker {
      color: var(--signal);
    }

    details[open] summary {
      color: var(--signal);
    }

    details > :last-child {
      margin-bottom: 0;
    }

    .table-wrap {
      max-width: 100%;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      border-top: 2px solid var(--signal);
      background: var(--panel);
    }

    caption {
      padding-bottom: 0.8rem;
      color: var(--text);
      font-family: var(--condensed);
      font-size: 1.3rem;
      font-weight: 700;
      text-align: left;
    }

    th,
    td {
      padding: 0.9rem 0.8rem;
      border-bottom: 1px solid var(--border);
      overflow-wrap: anywhere;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--signal);
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.035em;
    }

    td {
      color: var(--text);
      font-size: 0.9rem;
    }

    tbody tr:hover {
      background: rgba(79, 209, 197, 0.035);
    }

    .site-footer {
      padding-block: 1.4rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      background: var(--bg);
    }

    .site-footer .container {
      display: flex;
      justify-content: flex-end;
    }

    .build-date {
      font-size: 0.7rem;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    /* Depth pass: ambient light, layered surfaces, and reactive states. */
    :root {
      --radius: 10px;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
    }

    .hero {
      position: relative;
      isolation: isolate;
    }

    .hero::before {
      position: absolute;
      z-index: -1;
      inset: -25% -12% -10%;
      background:
        radial-gradient(58% 52% at 16% 28%, rgba(79, 209, 197, 0.14), transparent 70%),
        radial-gradient(44% 44% at 84% 10%, rgba(224, 164, 88, 0.1), transparent 72%);
      pointer-events: none;
      content: "";
    }

    @supports (-webkit-background-clip: text) or (background-clip: text) {
      .hero h1 {
        background: linear-gradient(176deg, var(--text) 34%, #7f95a6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    }

    .live-card {
      background: linear-gradient(152deg, var(--panel-raised), var(--panel) 58%);
    }

    .live-card::before {
      animation: live-pulse 2.6s ease-out infinite;
    }

    @keyframes live-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.5);
      }

      70% {
        box-shadow: 0 0 0 0.8rem rgba(79, 209, 197, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(79, 209, 197, 0);
      }
    }

    .project-card,
    .timeline-item,
    .stat,
    .button {
      transition:
        transform 200ms ease,
        border-color 200ms ease,
        box-shadow 200ms ease,
        background-color 200ms ease,
        color 200ms ease;
    }

    .project-card:hover,
    .timeline-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
    }

    .project-card:hover {
      border-top-color: var(--signal);
    }

    .timeline-item:hover {
      border-color: #31465a;
    }

    .stat {
      position: relative;
      overflow: hidden;
      background: linear-gradient(158deg, var(--panel-raised), var(--panel) 62%);
    }

    .stat::after {
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, var(--signal), transparent 78%);
      content: "";
    }

    .stat:hover {
      transform: translateY(-2px);
      border-color: #31465a;
    }

    .button--primary {
      background: linear-gradient(135deg, var(--signal), #74e8dd);
      box-shadow: 0 10px 28px rgba(79, 209, 197, 0.2);
    }

    .button--primary:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #74e8dd, var(--signal));
      color: var(--bg);
      box-shadow: 0 15px 36px rgba(79, 209, 197, 0.3);
    }

    .site-header {
      background: rgba(10, 14, 17, 0.82);
      backdrop-filter: blur(16px) saturate(140%);
    }

    .more-disclosure {
      margin-top: clamp(1.5rem, 4vw, 2.25rem);
    }

    .more-disclosure-body {
      padding: 0 clamp(1rem, 3vw, 1.5rem) clamp(1rem, 3vw, 1.5rem);
      border-top: 1px solid var(--border);
    }

    .more-disclosure-body > h3 {
      margin-top: 1.5rem;
    }

    .architecture-diagram {
      width: 100%;
      height: auto;
    }

    .diagram-node rect {
      fill: var(--panel-raised);
      stroke: var(--border);
    }

    .diagram-region rect,
    .diagram-zone rect {
      fill: none;
      stroke: var(--border);
      stroke-dasharray: 5 4;
    }

    .diagram-label {
      fill: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      text-anchor: middle;
    }

    .diagram-sub,
    .diagram-zone-label,
    .diagram-region-label {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      text-anchor: middle;
    }

    .diagram-zone-label,
    .diagram-region-label,
    .diagram-note {
      text-anchor: start;
    }

    .diagram-region-label {
      fill: var(--signal);
      letter-spacing: 0.08em;
    }

    .diagram-flow {
      stroke: var(--signal);
      stroke-width: 1.5;
      marker-end: url(#diagram-arrow);
    }

    .architecture-diagram marker path {
      fill: var(--signal);
    }

    /* Section rhythm: give each band its own surface so the page reads as
       chapters rather than one long table. The live section is the centrepiece,
       so it gets the light; the rest alternate a quiet tint. */
    main > section {
      position: relative;
      isolation: isolate;
    }

    main > section + section {
      border-top: 0;
    }

    main > #live {
      padding-block: clamp(5rem, 9vw, 8.5rem);
      border-block: 1px solid var(--border);
      background:
        radial-gradient(64% 58% at 50% 0%, rgba(79, 209, 197, 0.1), transparent 72%),
        linear-gradient(180deg, #0D141A, var(--bg) 88%);
    }

    main > #experience,
    main > #awards,
    main > #skills,
    main > #contact {
      border-block: 1px solid var(--border);
      background: rgba(17, 25, 32, 0.5);
    }

    /* The numeral is the chapter marker, so let it act like one. */
    .section-label {
      display: block;
      margin-bottom: 1rem;
      font-size: clamp(0.82rem, 1.6vw, 0.95rem);
      letter-spacing: 0.16em;
    }

    .section-heading {
      position: relative;
      padding-top: 1.75rem;
    }

    .section-heading::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 3.25rem;
      height: 2px;
      background: var(--signal);
      content: "";
    }

    /* The numbers are the fastest read on the page; size them like it. */
    .stats-grid {
      margin-top: clamp(1.5rem, 4vw, 2.5rem);
      gap: 1px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--border);
    }

    .stat {
      border: 0;
      border-radius: 0;
      background: linear-gradient(158deg, var(--panel-raised), var(--panel) 62%);
    }

    .stat:hover {
      transform: none;
      background: var(--panel-raised);
    }

    .stat-value {
      font-size: clamp(2rem, 5vw, 3.1rem);
      letter-spacing: -0.02em;
    }

    .screen-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-bottom: clamp(2.5rem, 6vw, 4rem);
    }

    .screen {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .screen a {
      display: block;
      overflow: hidden;
      line-height: 0;
    }

    .screen img {
      width: 100%;
      height: auto;
      transition: transform 400ms ease;
    }

    .screen:hover img {
      transform: scale(1.03);
    }

    .screen:hover {
      border-color: var(--signal);
    }

    .screen figcaption {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 0.7rem;
      align-items: baseline;
      padding: 0.85rem 1rem;
      border-top: 1px solid var(--border);
      line-height: 1.5;
    }

    .screen figcaption strong {
      font-family: var(--condensed);
      font-size: 1.05rem;
    }

    .screen figcaption .meta {
      font-size: 0.82rem;
    }

    @media (max-width: 860px) {
      :root {
        --header-height: 4rem;
      }

      .section-heading,
      .live-card {
        grid-template-columns: 1fr;
      }

      .section-heading {
        gap: 0.6rem;
      }

      .hero {
        min-height: auto;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .screen-grid {
        grid-template-columns: 1fr;
      }

      .project-grid,
      .compact-grid,
      .split-grid {
        grid-template-columns: 1fr;
      }

      .timeline::before {
        left: 1.55rem;
      }

      .timeline-item {
        grid-template-columns: 1fr;
        gap: 0.55rem;
        padding-left: 3rem;
      }

      .timeline-item::before {
        top: 1.65rem;
        left: 1.22rem;
      }

      table.responsive-table,
      .responsive-table tbody,
      .responsive-table tr,
      .responsive-table td {
        display: block;
        width: 100%;
      }

      .responsive-table {
        border-top: 0;
        background: transparent;
      }

      .responsive-table thead {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .responsive-table tr {
        margin-bottom: 0.8rem;
        padding: 0.65rem 1rem;
        border: 1px solid var(--border);
        border-top: 2px solid var(--signal);
        border-radius: var(--radius);
        background: var(--panel);
      }

      .responsive-table td {
        padding: 0.55rem 0;
        border-bottom: 1px solid var(--border);
      }

      .responsive-table td:last-child {
        border-bottom: 0;
      }

      .responsive-table td::before {
        display: block;
        margin-bottom: 0.15rem;
        color: var(--signal);
        content: attr(data-label);
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.035em;
      }
    }

    @media (max-width: 560px) {
      :root {
        --header-height: 7.4rem;
      }

      .container {
        width: min(calc(100% - 1.25rem), 1080px);
      }

      .header-inner {
        min-height: var(--header-height);
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.45rem 0.75rem;
        padding-block: 0.55rem;
      }

      .language-switcher {
        flex-wrap: nowrap;
        justify-content: flex-end;
      }

      .primary-nav {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .primary-nav ul {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 0.2rem;
      }

      .primary-nav a {
        min-height: 2.25rem;
        overflow: visible;
        padding: 0.35rem 0.1rem;
        font-size: 0.66rem;
        line-height: 1.15;
        text-align: center;
        white-space: normal;
      }

      [data-lang-button] {
        min-width: 2rem;
        min-height: 2rem;
        padding: 0.45rem;
        font-size: 0.68rem;
      }

      .section,
      main > section {
        padding-block: 3.5rem;
      }

      .hero {
        padding-block: 4rem;
      }

      h1 {
        max-width: 100%;
        font-size: clamp(2.3rem, 12vw, 3.25rem);
        text-wrap: pretty;
      }

      .stats-grid {
        gap: 0.65rem;
      }

      .stat {
        padding: 1rem;
      }

      .stat-value {
        font-size: clamp(1.4rem, 8vw, 2rem);
      }

      .project-filters {
        align-items: stretch;
      }

      [data-filter] {
        flex: 1 1 calc(50% - 0.55rem);
        line-height: 1.3;
      }

      .live-card,
      .panel,
      .card {
        padding: 1.15rem;
      }

      .project-overview,
      .project-detail {
        padding: 1.15rem;
      }

      .project-overview {
        padding-right: 3.25rem;
      }

      .project-overview::after {
        top: 1.15rem;
        right: 1.15rem;
      }

      .architecture-figure {
        padding: 0.65rem;
      }

      .timeline-item {
        padding: 1.15rem 1.15rem 1.15rem 2.65rem;
      }

      .timeline::before {
        left: 1.2rem;
      }

      .timeline-item::before {
        left: 0.87rem;
      }

      th,
      td {
        font-size: 0.84rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media print {
      :root {
        color-scheme: light;
      }

      html,
      body {
        color: #111;
        background: #fff;
        font-size: 10pt;
      }

      .site-header,
      .skip-link,
      .project-filters,
      .language-switcher,
      .site-footer {
        display: none !important;
      }

      .container {
        width: 100%;
      }

      .section,
      main > section {
        padding-block: 1.5rem;
        break-inside: avoid;
      }

      .live-card,
      .panel,
      .card,
      .project-card,
      .stat,
      .timeline-item,
      table {
        color: #111;
        background: #fff;
        border-color: #777;
        box-shadow: none;
        break-inside: avoid;
      }

      h1,
      h2,
      h3,
      h4,
      .button,
      td {
        color: #111;
      }

      .muted,
      .section-intro,
      .meta {
        color: #444;
      }

      details:not([open]) > :not(summary),
      [hidden] {
        display: block !important;
      }

      a[href^="http"]::after {
        color: #444;
        content: " (" attr(href) ")";
        font-family: var(--mono);
        font-size: 8pt;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skip_to_content">본문으로 건너뛰기</a>
  {{BODY}}
  <script id="translations" type="application/json">{{TRANSLATIONS_JSON}}</script>
  <script>
    (() => {
      "use strict";

      const languageButtons = [...document.querySelectorAll("[data-lang-button]")];
      const translatedNodes = [...document.querySelectorAll("[data-i18n]")];
      const translatedLabels = [...document.querySelectorAll("[data-i18n-label]")];
      const translatedAriaLabels = [...document.querySelectorAll("[data-i18n-aria-label]")];
      const defaultText = new Map(translatedNodes.map((node) => [node, node.textContent]));
      const defaultLabels = new Map(translatedLabels.map((node) => [node, node.dataset.label || ""]));
      const defaultAriaLabels = new Map(translatedAriaLabels.map((node) => [node, node.getAttribute("aria-label") || ""]));
      const languageOf = (button) => (button.dataset.langButton || button.dataset.lang || "").toLowerCase();
      let translations = {};

      try {
        translations = JSON.parse(document.getElementById("translations").textContent);
      } catch (_) {
        translations = {};
      }

      const lookup = (language, key) => {
        const alias = language === "jp" ? "ja" : language === "ja" ? "jp" : language;
        return translations[language]?.[key]
          ?? translations[alias]?.[key]
          ?? translations[key]?.[language]
          ?? translations[key]?.[alias];
      };

      const setLanguage = (language) => {
        translatedNodes.forEach((node) => {
          const value = lookup(language, node.dataset.i18n)
            ?? lookup("ko", node.dataset.i18n)
            ?? defaultText.get(node);
          node.textContent = value;
        });

        translatedLabels.forEach((node) => {
          node.dataset.label = lookup(language, node.dataset.i18nLabel)
            ?? lookup("ko", node.dataset.i18nLabel)
            ?? defaultLabels.get(node);
        });

        translatedAriaLabels.forEach((node) => {
          node.setAttribute(
            "aria-label",
            lookup(language, node.dataset.i18nAriaLabel)
              ?? lookup("ko", node.dataset.i18nAriaLabel)
              ?? defaultAriaLabels.get(node),
          );
        });

        document.documentElement.lang = language === "jp" ? "ja" : language;
        languageButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(languageOf(button) === language));
        });

        try {
          localStorage.setItem("portfolio-language", language);
        } catch (_) {
          // The page still works when storage is blocked.
        }
      };

      languageButtons.forEach((button) => {
        button.addEventListener("click", () => setLanguage(languageOf(button)));
      });

      if (languageButtons.length) {
        let savedLanguage = "";
        try {
          savedLanguage = localStorage.getItem("portfolio-language") || "";
        } catch (_) {
          savedLanguage = "";
        }

        const availableLanguages = languageButtons.map(languageOf);
        const browserLanguage = () => {
          const tags = [...(navigator.languages || []), navigator.language || ""];
          for (const tag of tags) {
            const base = String(tag).toLowerCase().split("-")[0];
            const normalized = base === "jp" ? "ja" : base;
            if (availableLanguages.includes(normalized)) {
              return normalized;
            }
          }
          return "";
        };
        const initialLanguage = availableLanguages.includes(savedLanguage)
          ? savedLanguage
          : browserLanguage()
            || (availableLanguages.includes("ko") ? "ko" : availableLanguages[0]);
        setLanguage(initialLanguage);
      }

      const filterButtons = [...document.querySelectorAll("[data-filter]")];
      const projects = [...document.querySelectorAll("[data-project-categories]")];

      const setFilter = (filter) => {
        filterButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
        });

        projects.forEach((project) => {
          const categories = (project.dataset.projectCategories || "").split(/[\s,]+/).filter(Boolean);
          project.hidden = filter !== "all" && !categories.includes(filter);
        });
      };

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => setFilter(button.dataset.filter || "all"));
      });

      if (filterButtons.length) setFilter("all");
    })();
  </script>
</body>
</html>
